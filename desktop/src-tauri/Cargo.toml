[package]
name = "tangent-desktop"
version = "1.0.0"
description = "Tangent Pro Desktop Utility"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
csv = "1.3"
rfd = "0.14"
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = "0.4"
ahash = "0.8"
strsim = "0.10"

sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "mysql", "sqlite", "any", "json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
scraper = "0.20"
futures = "0.3"

tokio-cron-scheduler = "0.13.0"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.23.1"

flate2 = "1.0"
tauri-plugin-dialog = "2.8.1"

calamine = { version = "0.36.1", features = ["chrono"] }
rust_xlsxwriter = "0.99.1"
arrow-array = "58.1.0"
arrow-schema = "58.1.0"
arrow-ipc = "58.1.0"
arrow-cast = "58.1.0"
