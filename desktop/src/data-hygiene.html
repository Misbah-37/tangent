</div>

    <script>

        // SPA IPC Bridge
        if (window.parent && window.parent !== window && window.parent.__TAURI__) {
            window.__TAURI__ = window.parent.__TAURI__;
        }
    
        const { invoke } = window.__TAURI__.core;
        
        // Window Controls
        document.getElementById('btn-close')?.addEventListener('click', () => invoke('close_window'));
        document.getElementById('btn-maximize')?.addEventListener('click', () => invoke('maximize_window'));
        document.getElementById('btn-minimize')?.addEventListener('click', () => invoke('minimize_window'));
        
        // Theme
        document.getElementById('theme-btn')?.addEventListener('click', () => { 
            const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            // Push theme to all iframes
            document.querySelectorAll('iframe').forEach(f => {
                try { f.contentWindow.document.documentElement.setAttribute('data-theme', newTheme); } catch(e){}
            });
        });
        
        // Sidebar Toggle
        document.getElementById('btn-toggle-sidebar')?.addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('collapsed');
        });

        // SPA Navigation Logic
        const navItems = document.querySelectorAll('.nav-item[data-target]');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                // Update active class
                navItems.forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                
                // Hide all iframes
                document.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
                
                // Show target iframe
                const target = item.getAttribute('data-target');
                document.getElementById('frame-' + target).style.display = 'block';
            });
        });
        
        // Global Shared Data Pool
        window.GlobalWorkspacePath = null;
        window.GlobalWorkspaceDb = null;
    
        document.getElementById('btn-load-empty').addEventListener('click', function() {
            document.getElementById('btn-load').click();
        });

    
        // === Universal Open-In Handoff Logic ===
        document.addEventListener('click', function() { document.querySelectorAll('[id^="open-in-menu"]').forEach(m => m.style.display = 'none'); });
        window._openInTarget = async function(targetUrl) {
            document.querySelectorAll('[id^="open-in-menu"]').forEach(m => m.style.display = 'none');
            let targetPath = null;
            try {
                if (window.lastExportTempPath) targetPath = window.lastExportTempPath;
                else if (typeof window.lastQueryRows !== 'undefined' && window.lastQueryRows && window.lastQueryRows.length > 0) {
                    const headers = Object.keys(window.lastQueryRows[0]).join(',');
                    const csvStr = window.lastQueryRows.map(r => Object.values(r).map(v => typeof v === 'string' ? '"' + v.replace(/"/g, '""') + '"' : v).join(',')).join('\n');
                    targetPath = await window.__TAURI__.core.invoke('write_temp_file_native', { text: headers + '\n' + csvStr, ext: 'csv' });
                } else if (typeof activeFilePath !== 'undefined' && activeFilePath) targetPath = activeFilePath;
                else if (typeof currentFilePath !== 'undefined' && currentFilePath) targetPath = currentFilePath;
                else if (typeof loadedFiles !== 'undefined' && loadedFiles && loadedFiles.length > 0) targetPath = loadedFiles[0];
                else if (window.parent && window.parent.GlobalWorkspacePath) targetPath = window.parent.GlobalWorkspacePath;
            } catch (err) { console.error("Handoff export error:", err); }

            if (targetPath && window.parent && window.parent !== window) {
                window.parent.GlobalWorkspacePath = targetPath;
                window.parent.GlobalWorkspaceDb = null;
                window.parent.GlobalWorkspaceTableName = null;
                var targetFrame = window.parent.document.getElementById('frame-' + targetUrl);
                if (targetFrame) targetFrame.src = targetUrl;
                if(window.parent.switchTool) window.parent.switchTool(targetUrl);
            } else {
                if(window.TangentToast) window.TangentToast.show("Please load or process a dataset first.");
            }
        };
        
</script>
