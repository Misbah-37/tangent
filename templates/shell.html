/* INJECT_TOOL_STYLES */

/* ── Tangent Global Loader ── */
#tangentLoader {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(8, 9, 13, 0.88);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}
.tl-logo-wrap {
  position: relative;
  width: 88px;
  height: 88px;
}
.tl-logo-wrap svg {
  width: 88px;
  height: 88px;
  overflow: visible;
}
/* Arc draws itself */
.tl-arc {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: tlDrawArc 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
/* Line fades and scales in after arc */
.tl-line {
  transform-origin: 32px 14px;
  transform-box: fill-box;
  animation: tlPulseLine 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes tlDrawArc {
  0%   { stroke-dashoffset: 1; opacity: 0.2; }
  20%  { opacity: 1; }
  70%  { stroke-dashoffset: 0; }
  90%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 1; opacity: 0.2; }
}
@keyframes tlPulseLine {
  0%, 30%  { opacity: 0; transform: scaleY(0.1); }
  60%, 85% { opacity: 1; transform: scaleY(1); }
  100%     { opacity: 0; transform: scaleY(0.1); }
}
/* Glow ring behind logo */
.tl-glow {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,210,255,0.12) 0%, transparent 70%);
  animation: tlGlowPulse 1.6s ease-in-out infinite;
}
@keyframes tlGlowPulse {
  0%, 100% { opacity: 0.4; transform: scale(0.9); }
  50%       { opacity: 1;   transform: scale(1.1); }
}
.tl-message {
  color: #94a3b8;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  font-family: Inter, -apple-system, sans-serif;
  animation: tlFadeMsg 1.6s ease-in-out infinite;
}
@keyframes tlFadeMsg {
  0%, 100% { opacity: 0.5; }
  50%       { opacity: 1; }
}

    /* Tauri Native Titlebar */
    #tauri-titlebar {
      display: none;
      height: 38px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      justify-content: space-between;
      align-items: center;
      user-select: none;
      width: 100%;
      position: fixed;
      top: 0;
      z-index: 9999;
    }
    body.tauri-mode { padding-top: 38px; }
    body.tauri-mode .global-nav { top: 38px; }
    body.tauri-mode .sidebar { top: 38px; height: calc(100vh - 38px); }

    /* Hide all web-centric marketing, SEO, and donation widgets in the Pro App */
    body.tauri-mode .sidebar-support-widget,
    body.tauri-mode .toast,
    body.tauri-mode .info-section,
    body.tauri-mode .faq-title,
    body.tauri-mode .faq-box,
    body.tauri-mode .features-grid,
    body.tauri-mode footer,
    body.tauri-mode .clean-header p,
    body.tauri-mode .badge-pill {
        display: none !important;
    }

    /* Condense the tool headers so it feels like a native desktop app */
    body.tauri-mode .clean-header {
        margin-bottom: 20px !important;
        padding-top: 20px !important;
    }
    body.tauri-mode .clean-header h1 {
        font-size: 1.8rem !important;
        margin-bottom: 0 !important;
    }
    
    /* Make the workspace take up more vertical space since we hid the fluff */
    body.tauri-mode .hygiene-workspace {
        min-height: calc(100vh - 120px) !important;
    }
    body.tauri-mode .panel {
        height: 100%;
    }

    
    #tauri-titlebar .drag-region { flex-grow: 1; height: 100%; display: flex; align-items: center; padding-left: 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
    #tauri-titlebar .actions { display: flex; height: 100%; }
    #tauri-titlebar .btn { width: 46px; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--text-muted); transition: 0.2s; padding: 0; background: transparent; }
    #tauri-titlebar .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    #tauri-titlebar .btn.close:hover { background: #e81123; color: #fff; }

</style>

<!-- Global Shell Script -->
<script src="assets/tangent.js?v=1"></script>

<!-- Global TangentLoader Utility -->
<script>
  window.TangentLoader = {
    show: function(msg) {
      var el = document.getElementById('tangentLoader');
      var msgEl = document.getElementById('tangentLoaderMsg');
      if (msgEl) msgEl.textContent = msg || 'Processing...';
      if (el) el.style.display = 'flex';
    },
    hide: function() {
      var el = document.getElementById('tangentLoader');
      if (el) el.style.display = 'none';
    }
  };

  window.TangentToast = {
    show: function(titleMsg) {
      var toast = document.getElementById('tangentToast');
      var title = document.getElementById('toastTitle');
      var closeBtn = document.getElementById('toastCloseBtn');
      if (!toast || !title) return;
      
      title.textContent = titleMsg || 'Task Complete!';
      toast.classList.add('show');
      
      if (closeBtn) {
        closeBtn.onclick = function() {
          toast.classList.remove('show');
        };
      }
      
      setTimeout(function() {
        toast.classList.remove('show');
      }, 12000);
    }
  };
</script>

<!-- INJECT_SCRIPTS -->


<script>
    // Tauri Desktop Initialization
    function initTauriMode() {
      if (window.__TAURI__) {
        document.body.classList.add('tauri-mode');
        document.getElementById('tauri-titlebar').style.display = 'flex';
        
        // Theme Engine
        const themeBtn = document.getElementById('tauri-theme-toggle');
        function applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
            document.body.setAttribute('data-theme', theme);
          localStorage.setItem('tangent_pro_theme', theme);
          themeBtn.innerHTML = theme === 'light' 
            ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>'
            : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
        }
        
        const savedTheme = localStorage.getItem('tangent_pro_theme') || 'dark';
        applyTheme(savedTheme);
        
        themeBtn.addEventListener('click', () => {
          const current = document.body.getAttribute('data-theme');
          applyTheme(current === 'light' ? 'dark' : 'light');
        });

        const invoke = window.__TAURI__.core.invoke;
        document.getElementById('tauri-minimize').addEventListener('click', () => invoke('minimize_window'));
        document.getElementById('tauri-maximize').addEventListener('click', () => invoke('maximize_window'));
        document.getElementById('tauri-close').addEventListener('click', () => invoke('close_window'));
      }
    }
    document.addEventListener('DOMContentLoaded', initTauriMode);
    setTimeout(initTauriMode, 150); // Fallback
</script>
