<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- INJECT_HEAD_META -->

<!-- Favicons -->
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">

<link rel="stylesheet" href="assets/tangent.css?v=8">
<style>
/* INJECT_TOOL_STYLES */

/* ── Tangent Global Loader ── */
#tangentLoader {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(8, 9, 13, 0.88);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}
.tl-logo-wrap {
  position: relative;
  width: 88px;
  height: 88px;
}
.tl-logo-wrap svg {
  width: 88px;
  height: 88px;
  overflow: visible;
}
/* Arc draws itself */
.tl-arc {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: tlDrawArc 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
/* Line fades and scales in after arc */
.tl-line {
  transform-origin: 32px 14px;
  transform-box: fill-box;
  animation: tlPulseLine 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes tlDrawArc {
  0%   { stroke-dashoffset: 1; opacity: 0.2; }
  20%  { opacity: 1; }
  70%  { stroke-dashoffset: 0; }
  90%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 1; opacity: 0.2; }
}
@keyframes tlPulseLine {
  0%, 30%  { opacity: 0; transform: scaleY(0.1); }
  60%, 85% { opacity: 1; transform: scaleY(1); }
  100%     { opacity: 0; transform: scaleY(0.1); }
}
/* Glow ring behind logo */
.tl-glow {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,210,255,0.12) 0%, transparent 70%);
  animation: tlGlowPulse 1.6s ease-in-out infinite;
}
@keyframes tlGlowPulse {
  0%, 100% { opacity: 0.4; transform: scale(0.9); }
  50%       { opacity: 1;   transform: scale(1.1); }
}
.tl-message {
  color: #94a3b8;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  font-family: Inter, -apple-system, sans-serif;
  animation: tlFadeMsg 1.6s ease-in-out infinite;
}
@keyframes tlFadeMsg {
  0%, 100% { opacity: 0.5; }
  50%       { opacity: 1; }
}
</style>

<!-- Enforce Custom Domain Canonical -->
<script>
  if (window.location.hostname.includes("github.io")) {
    window.location.replace("https://runtangent.com" + window.location.pathname + window.location.hash);
  }
</script>
</head>
<body>

<!-- Global Navigation -->
<nav class="global-nav">
  <div class="nav-left">
    <a href="/" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
        <path d="M 32 50 C 22.06 50 14 41.94 14 32 C 14 22.06 22.06 14 32 14 L 54 14" stroke="#00d2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 32 14 V 44" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <span style="display:inline-flex; align-items:center; letter-spacing:-0.5px;"><span style="color:#ffffff; font-weight:800;">Tan</span><span style="color:#00d2ff; font-weight:800;">gent</span></span>
    </a>

    <!-- Push-Sidebar Toggle Button -->
    <button type="button" class="toolkit-toggle-btn" id="toolkitToggle" aria-label="Toggle Toolkit Directory" aria-expanded="false">
      <svg class="sidebar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
      <span>Toolkit</span>
    </button>
  </div>

  <div class="nav-right">
    <!-- Hamburger Button (Mobile Only) -->
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation Menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Navigation Links -->
    <div class="nav-links" id="navLinks">
      <!-- INJECT_NAV_LINKS -->
    </div>
  </div>
</nav>

<!-- INJECT_SIDEBAR -->

<!-- Backdrop Overlay for Mobile -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- ── Global Tangent Loader ── -->
<div id="tangentLoader" role="status" aria-live="polite" aria-label="Loading">
  <div class="tl-logo-wrap">
    <div class="tl-glow"></div>
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path class="tl-arc"
        d="M 32 50 C 22.06 50 14 41.94 14 32 C 14 22.06 22.06 14 32 14 L 54 14"
        stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1"/>
      <path class="tl-line"
        d="M 32 14 V 44"
        stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="tl-message" id="tangentLoaderMsg">Processing...</div>
</div>

<!-- Push-Canvas Wrapper -->
<div class="app-canvas" id="appCanvas">

<!-- INJECT_CONTENT -->

  <!-- Standard Global Footer -->
  <footer class="global-footer">
    <div style="margin-bottom: 16px;">
      <a href="/">Home</a>
      <a href="https://github.com/Misbah-37/tangent" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="mailto:hello@runtangent.com">Contact</a>
      <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">Back to Top</a>
    </div>
    <div>&copy; 2026 Tangent. Built for speed, privacy, and precision.</div>
  </footer>

</div>


<!-- Global Success Toast -->
<div class="tangent-toast" id="tangentToast">
  <div class="toast-content">
    <div class="toast-header">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <span id="toastTitle">Success!</span>
    </div>
    <div class="toast-body">
      If Tangent saved you time today, consider supporting the project to keep it 100% free and ad-free.
    </div>
    <div class="toast-actions">
      <a href="https://misbahul0.gumroad.com/l/support-tangent" target="_blank" rel="noopener noreferrer" class="toast-btn toast-btn-primary">Support Tangent</a>
      <button class="toast-btn toast-btn-ghost" id="toastCloseBtn">Dismiss</button>
    </div>
  </div>
</div>

<!-- Global Shell Script -->
<script src="assets/tangent.js?v=1"></script>

<!-- Global TangentLoader Utility -->
<script>
  window.TangentLoader = {
    show: function(msg) {
      var el = document.getElementById('tangentLoader');
      var msgEl = document.getElementById('tangentLoaderMsg');
      if (msgEl) msgEl.textContent = msg || 'Processing...';
      if (el) el.style.display = 'flex';
    },
    hide: function() {
      var el = document.getElementById('tangentLoader');
      if (el) el.style.display = 'none';
    }
  };

  window.TangentToast = {
    show: function(titleMsg) {
      var toast = document.getElementById('tangentToast');
      var title = document.getElementById('toastTitle');
      var closeBtn = document.getElementById('toastCloseBtn');
      if (!toast || !title) return;
      
      title.textContent = titleMsg || 'Task Complete!';
      toast.classList.add('show');
      
      if (closeBtn) {
        closeBtn.onclick = function() {
          toast.classList.remove('show');
        };
      }
      
      setTimeout(function() {
        toast.classList.remove('show');
      }, 12000);
    }
  };
</script>

<!-- INJECT_SCRIPTS -->

</body>
</html>
